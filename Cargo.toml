[package]
name = "muxloom"
version = "0.5.5"
edition = "2024"
rust-version = "1.85"
description = "A terminal loom for persistent Codex and Claude Code sessions across machines"
license = "GPL-3.0-only"
repository = "https://github.com/MarsTechHAN/Muxloom"
readme = "README.md"

[dependencies]
anyhow = "1.0"
crossterm = "0.28"
csv = "1.4"
flate2 = { version = "1.1.9", optional = true }
image = { version = "=0.25.5", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "qoi", "tiff", "webp"] }
libc = "0.2"
lz4_flex = "0.11"
minreq = { version = "3.0.0", default-features = false, features = ["https-rustls", "proxy"] }
portable-pty = "0.8"
qrcode = { version = "0.14.1", default-features = false }
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
# `preserve_order` so rewriting a user's agent configuration keeps their keys
# where they put them rather than sorting the file.
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
shell-words = "1.1"
signal-hook = "0.3"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
tar = { version = "0.4.46", optional = true }
toml = "0.8"
unicode-width = "0.2"
vt100 = "0.15"
zstd = { version = "0.13", optional = true }

[features]
# The `controller` feature carries what only the `muxloom` dashboard does:
# fetching and unpacking companion/agent packages and self-updates
# (flate2/tar), plus the local history backup store (zstd). The `muxloomd`
# companion is built with `--no-default-features` and links neither.
#
# HTTPS (rustls, via minreq) is *not* behind the feature: every build needs it,
# because an agent on any machine sends its channel messages from the machine
# it runs on rather than borrowing the controller's network.
default = ["controller"]
controller = ["dep:flate2", "dep:tar", "dep:zstd"]
