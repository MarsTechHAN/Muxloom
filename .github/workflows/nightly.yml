name: Nightly

# Publishes the newest green commit on main as the rolling `nightly`
# prerelease, so a fix reaches installs the day it is written instead of
# waiting for a tag. It is a *prerelease*, which keeps `releases/latest` — what
# the stable update check and the remote companion pull both read — pointing at
# the newest tagged release.
#
# The trigger is the regression workflow finishing green rather than the push
# itself: a nightly nobody could install safely is worse than no nightly.

on:
  workflow_run:
    workflows: ["Cross-platform regression"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_VERSION: "1.97.1"
  FFMPEG_STATIC_RELEASE: "b6.1.1"

jobs:
  build:
    name: Compile ${{ matrix.label }}
    # A fork's pull request can carry the branch name `main` too, and this job
    # ends up published under this repository's name, so the source repository
    # is checked as well as the branch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            executable: muxloom
            ffmpeg_platform: linux
            ffmpeg_arch: x64
          - label: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            executable: muxloom
            ffmpeg_platform: darwin
            ffmpeg_arch: arm64
          - label: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            executable: muxloom
            ffmpeg_platform: darwin
            ffmpeg_arch: x64
          - label: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: muxloom.exe
            ffmpeg_platform: win32
            ffmpeg_arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the commit that went green
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # The whole history: the commit count is what orders two nightlies
          # that share a package version.
          fetch-depth: 0

      - name: Stamp the build with the commit it came from
        shell: bash
        run: |
          commit="$(git rev-parse HEAD)"
          {
            echo "MUXLOOM_BUILD_ID=$commit"
            echo "MUXLOOM_BUILD_HEIGHT=$(git rev-list --count HEAD)"
            # A build knows which stream it came from, which is how an install
            # keeps following the one it is already on without being told.
            echo "MUXLOOM_BUILD_CHANNEL=nightly"
          } >> "$GITHUB_ENV"

      - name: Install Rust target
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup target add "${{ matrix.target }}"

      - name: Install musl linker
        if: contains(matrix.target, 'musl')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Build release controller
        run: cargo build --locked --release --target ${{ matrix.target }} --bin muxloom

      - name: Build lean companion
        if: ${{ !contains(matrix.target, 'windows') }}
        run: cargo build --locked --release --target ${{ matrix.target }} --no-default-features --bin muxloomd

      - name: Fetch controller-side FFmpeg decoder
        shell: bash
        run: |
          mkdir -p vendor
          base="https://github.com/eugeneware/ffmpeg-static/releases/download/$FFMPEG_STATIC_RELEASE"
          asset="ffmpeg-${{ matrix.ffmpeg_platform }}-${{ matrix.ffmpeg_arch }}"
          executable="ffmpeg"
          if [[ "${{ matrix.ffmpeg_platform }}" == "win32" ]]; then
            executable="ffmpeg.exe"
          fi
          curl --fail --location --retry 3 "$base/$asset.gz" | gzip -d > "vendor/$executable"
          curl --fail --location --retry 3 "$base/${{ matrix.ffmpeg_platform }}-${{ matrix.ffmpeg_arch }}.LICENSE" \
            --output vendor/ffmpeg.LICENSE
          chmod +x "vendor/$executable"
          "vendor/$executable" -version | head -n 1

      - name: Stage raw binaries
        shell: bash
        run: |
          raw="raw/${{ matrix.target }}"
          mkdir -p "$raw"
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" "$raw/"
          cp vendor/ffmpeg* "$raw/"
          if [[ "${{ matrix.target }}" != *windows* ]]; then
            cp "target/${{ matrix.target }}/release/muxloomd" "$raw/"
          fi

      - name: Upload raw binaries
        uses: actions/upload-artifact@v7
        with:
          name: raw-${{ matrix.target }}
          path: raw
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Republish the rolling nightly release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the commit that went green
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Download raw binaries
        uses: actions/download-artifact@v8
        with:
          pattern: raw-*
          path: raw
          merge-multiple: true

      - name: Assemble all platform archives
        shell: bash
        run: |
          set -euo pipefail
          # Nightly archives are named after the package version, exactly as a
          # release's are, because that is the name the updater asks for. They
          # do not collide with the tagged release's assets: the two hang off
          # different tags.
          version="v$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          mkdir -p dist
          package_target() {
            target="$1"
            executable="$2"
            archive="$3"
            package="muxloom-${version}-${target}"
            root="dist/$package"
            mkdir -p "$root"
            cp "raw/$target/$executable" "$root/"
            if [[ -f "raw/$target/muxloomd" ]]; then
              cp "raw/$target/muxloomd" "$root/"
            fi
            cp raw/$target/ffmpeg* "$root/"
            for companion_target in \
              x86_64-unknown-linux-musl \
              aarch64-apple-darwin \
              x86_64-apple-darwin; do
              mkdir -p "$root/companions/$companion_target"
              cp "raw/$companion_target/muxloomd" \
                "$root/companions/$companion_target/muxloomd"
            done
            cp README.md LICENSE "$root/"
            if [[ "$archive" == "zip" ]]; then
              (cd dist && zip -qr "$package.zip" "$package")
              (cd dist && sha256sum "$package.zip" > "$package.zip.sha256")
            else
              chmod +x "$root/$executable" "$root/ffmpeg" "$root/muxloomd"
              chmod +x "$root"/companions/*/muxloomd
              tar -C dist -czf "dist/$package.tar.gz" "$package"
              (cd dist && sha256sum "$package.tar.gz" > "$package.tar.gz.sha256")
            fi
          }
          package_target x86_64-unknown-linux-musl muxloom tar.gz
          package_target aarch64-apple-darwin muxloom tar.gz
          package_target x86_64-apple-darwin muxloom tar.gz
          package_target x86_64-pc-windows-msvc muxloom.exe zip
          for companion_target in \
            x86_64-unknown-linux-musl \
            aarch64-apple-darwin \
            x86_64-apple-darwin; do
            asset="muxloomd-$companion_target"
            cp "raw/$companion_target/muxloomd" "dist/$asset"
            (cd dist && sha256sum "$asset" > "$asset.sha256")
          done
          # Everything in dist/ is uploaded as a release asset, so the staging
          # trees the archives were built from must not be left lying in it.
          find dist -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
          ls -l dist

      - name: Write the manifest that names this build
        shell: bash
        run: |
          set -euo pipefail
          # A rolling tag cannot say which commit it holds, and every nightly
          # between two releases carries the same package version — so the
          # manifest carries both, and the commit count orders them.
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          commit="$(git rev-parse HEAD)"
          height="$(git rev-list --count HEAD)"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '{\n  "version": "%s",\n  "commit": "%s",\n  "height": %s,\n  "built_at": "%s"\n}\n' \
            "$version" "$commit" "$height" "$built_at" > dist/nightly.json
          cat dist/nightly.json
          echo "MUXLOOM_NIGHTLY_LABEL=$version+$height (${commit:0:7})" >> "$GITHUB_ENV"

      - name: Republish the nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          cat > notes.md <<NOTES
          Rolling build of the newest green commit on \`main\` — $MUXLOOM_NIGHTLY_LABEL, from ${commit}.

          Installs following the nightly channel are offered this build the next
          time they check. To follow tagged releases only, set
          \`update_channel = "stable"\` in \`~/.config/muxloom/config.toml\`.
          NOTES
          # Replace the release outright rather than uploading over it: that is
          # the only way to be sure no asset from an older nightly survives
          # beside the ones this build produced.
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly dist/* \
            --target "$commit" \
            --prerelease \
            --title "Muxloom nightly $MUXLOOM_NIGHTLY_LABEL" \
            --notes-file notes.md
